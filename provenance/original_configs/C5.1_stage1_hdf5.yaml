seed: 42
weight_dtype: fp16
stage_init: true

modules:
  vae: ${oc.env:C5_1_SD15_PATH}/vae
  unet_2d: ${oc.env:C5_1_SD15_PATH}/unet
  scheduler: ${oc.env:C5_1_SD15_PATH}/scheduler
  apperance_encoder: ${oc.env:C5_1_SD15_PATH}/unet
  tokenizer: ${oc.env:C5_1_SD15_PATH}/tokenizer
  text_encoder: ${oc.env:C5_1_SD15_PATH}/text_encoder
  condition_encoder:
  empty_text_emb:
  unet:
  unet_additional_kwargs:
    unet_use_cross_frame_attention: false
    unet_use_temporal_attention: false
    use_motion_module: false

grad:
  vae: false
  unet_2d: false
  appearance_encoder: true
  text_encoder: false
  condition_encoder: true

gradient_checkpointing: false

solver:
  # Continue the same C5.1 run to a total of 200k steps.
  max_train_steps: 200000
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer:
    use_8bit_adam: false
    learning_rate: 1.0e-5
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 1.0e-2
    adam_epsilon: 1.0e-8
  lr_scheduler:
    name: constant
    lr_warmup_steps: 100

dataset:
  format: hdf5
  frame_size: [128, 128]
  frame_scale: [1.0, 1.0]
  frame_ratio: [1.0, 1.0]
  roots:
    - data/rwth/train
  hamer_roots:
    - data/hamer/train
  sample_rate: 1
  num_frames: 1
  ref_margin: 5
  uncond_ratio: 1
  mask_ratio: 0
  mask_thershold: 0.85
  skip_ratio: 0
  sk_mask_ratio: 0.1
  hamer_mask_ratio: 0.1
  both_mask_ratio: 0

dataloader:
  batch_size: 8
  num_workers: 4

noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: scaled_linear
  steps_offset: 1
  clip_sample: false

resume_from_checkpoint: ./workspace/C5.1_stage1_hdf5/20260829-1057
# Preserve the best validation result from step 141,000 when resuming.
best_ssim_at_resume: 0.8521732853536365
checkpointing_steps: 2000
valid_steps: 500
max_ckpt: 1
max_model: 1

enable_zero_snr: false
noise_offset: 0
clip_skip: 1
snr_gamma: 0
max_visible_frames: 0
max_sin_pe_len: 1000

validation_data:
  root: data/rwth/dev
  hamer_root: data/hamer/dev
  prompt: ""
  num_inference_steps: 20
  guidance_scale: 3.5
