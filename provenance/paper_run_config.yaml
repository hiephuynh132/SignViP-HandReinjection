seed: 42
weight_dtype: fp16
stage_init: true
save_frozen_modules: true
modules:
  vae: ./signvip/workspace_resume/C5.13_vae_reconstruction_hand4x_face4x_clip_dino_lpips/20260903-1245/best/vae
  unet_2d: ./animatediff/models/StableDiffusion/stable-diffusion-v1-5/unet
  scheduler: ./animatediff/models/StableDiffusion/stable-diffusion-v1-5/scheduler
  apperance_encoder: ./signvip/workspace_resume/C5.14_final_stage1_A4_best_vae/20260904-0816/best/appearance_encoder
  tokenizer: ./animatediff/models/StableDiffusion/stable-diffusion-v1-5/tokenizer
  text_encoder: ./animatediff/models/StableDiffusion/stable-diffusion-v1-5/text_encoder
  condition_encoder: ./signvip/workspace_resume/C5.14_final_stage1_A4_best_vae/20260904-0816/best/condition_encoder/model.bin
  hamer_reinjector: null
  empty_text_emb: null
  unet: null
  unet_additional_kwargs:
    unet_use_cross_frame_attention: false
    unet_use_temporal_attention: false
    use_motion_module: false
    hamer_reinject_kwargs:
      hand_channels: 256
      hidden_channels: 128
      enabled: true
      inject_mid: true
      inject_up_second_highest: true
      inject_up_highest: true
      log_shapes: true
      ratio_epsilon: 1.0e-06
grad:
  vae: false
  unet_2d: false
  appearance_encoder: true
  text_encoder: false
  condition_encoder: true
  hamer_reinjector: true
  selected_unet_modules: []
  selected_unet_name_patterns: []
  selected_condition_encoder_name_patterns: []
gradient_checkpointing: false
solver:
  max_train_steps: 1000000
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  optimizer:
    use_8bit_adam: false
    learning_rate: 5.0e-07
    lr_new: 0.0001
    lr_base: 5.0e-07
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_weight_decay: 0.01
    adam_epsilon: 1.0e-08
  lr_scheduler:
    name: cosine
    lr_warmup_steps: 200
dataset:
  format: hdf5
  frame_size:
  - 128
  - 128
  frame_scale:
  - 1.0
  - 1.0
  frame_ratio:
  - 1.0
  - 1.0
  roots:
  - data/rwth/train
  hamer_roots:
  - data/hamer/train
  detail_mask_cache: ./cache_grounded_sam2_face_hand_center_crop_128
  detail_mask_split: train
  detail_mask_strict: true
  sample_rate: 1
  num_frames: 1
  ref_margin: 5
  uncond_ratio: 1
  mask_ratio: 0
  mask_thershold: 0.85
  skip_ratio: 0
  sk_mask_ratio: 0.1
  hamer_mask_ratio: 0.1
  both_mask_ratio: 0
dataloader:
  batch_size: 8
  num_workers: 4
noise_scheduler_kwargs:
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: scaled_linear
  steps_offset: 1
  clip_sample: false
resume_from_checkpoint: ./signvip/workspace_c5_15/C5.15_final_stage1_A0_best_vae/20260920-1230
checkpointing_steps: 1000
valid_steps: 500
max_ckpt: 2
max_model: 1
enable_zero_snr: false
noise_offset: 0
clip_skip: 1
snr_gamma: 5
roi_loss_mode: stableanimator_weighted
hand_loss_weight: 1.0
face_loss_weight: 1.0
perceptual_loss:
  enabled: true
  clip_model: openai/clip-vit-large-patch14
  dino_model: facebook/dinov2-small
  diffusion_weight: 1.0
  clip_weight: 0.05
  dino_weight: 0.05
  decode_chunk_size: 2
hamer_reinject:
  log_interval: 100
max_visible_frames: 0
max_sin_pe_len: 1000
validation_data:
  root: data/rwth/dev
  hamer_root: data/hamer/dev
  prompt: ''
  num_inference_steps: 20
  guidance_scale: 3.5
  max_eval_batches: 12
report_to: tensorboard
save_frozen_vae: true
best_checkpoint:
  metric: balanced_hand_nonhand_ssim
  hand_weight: 0.5
  nonhand_weight: 0.5
early_stopping:
  enabled: false
exp_name: C5.15_final_stage1_A0_best_vae
config: configs/stage1/C5.15_final_stage1_A0_best_vae.yaml
